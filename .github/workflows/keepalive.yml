name: Keep-Alive Pinger

on:
  schedule:
    - cron: '*/20 * * * *' # Runs every 20 minutes to prevent Render's 15-min inactivity sleep
  workflow_dispatch:      # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Services
        run: |
          echo "Pinging ML Microservice..."
          curl -f -s https://server-sense-ml.onrender.com/health || echo "ML Ping failed/ignored"
          
          echo "Pinging Node.js Backend..."
          curl -f -s https://solar-sense-backend-8rsi.onrender.com/api/ml/health || echo "Backend Ping failed/ignored"
